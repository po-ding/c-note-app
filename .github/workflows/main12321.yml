name: GPS Step Build
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v3
      with:
        node-version: 18
        
    - name: npm install
      run: npm install
      
    - name: Build Web ONLY
      run: npm run build
      
    - name: Capacitor CLI Fix
      run: |
        npm install @capacitor/cli@5.7.0 --save-dev --force
        npx cap --version
        
    - name: Java + Android
      uses: actions/setup-java@v4
      with:
        java-version: 17
        
    - uses: android-actions/setup-android@v3
      
    - name: Cap Init
      run: |
        npx cap init CNote com.cnote.gps
        
    - name: Cap Add + Sync
      run: |
        npx cap add android
        npx cap sync android
        
    - name: APK
      run: |
        cd android
        ./gradlew assembleDebug
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: step-gps-apk
        path: android/app/build/outputs/apk/debug/*.apk
