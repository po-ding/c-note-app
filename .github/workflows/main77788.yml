name: GPS Yarn Build
on: [workflow_dispatch]

jobs:
  yarn:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: 18
        
    - name: Yarn Install
      run: |
        npm install -g yarn
        yarn install
        
    - name: Yarn Build
      run: yarn build  # npm run 우회!
      
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: yarn-vite-dist
        path: dist
