name: Web Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    - name: Install
      run: npm ci --include=dev --ignore-scripts
    - name: Build
      run: npm run build
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: dist-build
        path: dist/
