name: Web Build Only

on:
  workflow_dispatch:

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install deps
      run: npm install

    - name: Vite build
      run: npm run build

    - name: Upload dist
      uses: actions/upload-artifact@v4
      with:
        name: web-dist
        path: dist
