name: Web Build Only
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    - run: npm ci --include=dev
    - run: npm run build
    - uses: actions/upload-artifact@v4
      with:
        name: dist-build
        path: dist/
